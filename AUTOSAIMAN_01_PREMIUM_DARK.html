function cart(){const items=Object.keys(state.cart).filter(id=>state.cart[id]>0).map(id=>products.find(p=>p.id===Number(id))).filter(Boolean);const sum=items.reduce((s,p)=>s+p.price*state.cart[p.id],0);return `${pageTitle('Корзина',items.length?`Товаров в корзине: ${cartCount()}`:'Вы пока ничего не добавили')} ${items.length?`<div class="cart-layout"><div>${items.map(p=>`<div class="cart-item"><img src="${asset('part_'+p.img)}" alt=""><div class="cart-item-info"><strong>${p.title}</strong><small>${p.sku} · ${p.brand}</small><b>${money(p.price*state.cart[p.id])}</b></div><div class="qtycontrol"><button data-change-cart="${p.id}:-1">−</button><span>${state.cart[p.id]}</span><button data-change-cart="${p.id}:1">+</button></div><button class="remove" data-remove="${p.id}" aria-label="Удалить">${ico('trash',19)}</button></div>`).join('')}</div><aside class="total-box"><h3>Ваш заказ</h3><div class="total-row"><span>Товары (${cartCount()} шт.)</span><b>${money(sum)}</b></div><div class="total-row"><span>Доставка</span><b>Рассчитывается</b></div><div class="total-row final"><span>Итого</span><strong>${money(sum)}</strong></div><button class="redbtn" data-action="checkout">Оформить заказ ${ico('arrow',17)}</button><p style="color:var(--muted);font-size:10px;line-height:1.6">Демонстрационное оформление: данные не отправляются, оплата не производится.</p></aside></div>`:`<div class="empty">${ico('cart',42)}<h2>В корзине пока пусто</h2><p>Добавьте товары из каталога и вернитесь сюда.</p><button class="redbtn" data-go="catalog">Перейти в каталог ${ico('arrow',16)}</button></div>`}`}

 const heading=d.querySelector('h2');if(heading)heading.id='modal-heading';else d.querySelector('.modal').setAttribute('aria-label','Окно AUTOSAIMAN');
 d.addEventListener('click',e=>{if(e.target===d)closeModal()});
 (d.querySelector('[autofocus]')||d.querySelector('input:not([type=hidden]),select,.modal-top button'))?.focus({preventScroll:true});
}
function action(key){if(key==='cart')go('cart');if(key==='favorites')go('favorites');if(key==='selectcar')carModal();if(key==='consult')modal(`<h2>Подбор запчастей</h2><p>Демонстрационная форма. Заявка никуда не отправляется.</p><form data-form="consult"><label>Имя</label><input class="inputbox" required placeholder="Как к вам обращаться?"><label>Автомобиль или VIN</label><input class="inputbox" required placeholder="Например, Toyota Camry 2020"><label>Какая деталь нужна?</label><input class="inputbox" required placeholder="Название или артикул"><button class="redbtn">Отправить демо-заявку</button></form>`);if(key==='checkout')modal(`<h2>Оформление заказа</h2><p>Это интерактивный прототип: платежи не принимаются, заказ не передаётся в магазин.</p><form data-form="checkout"><label>Ваше имя</label><input class="inputbox" required placeholder="Имя покупателя"><label>Телефон</label><input class="inputbox" required placeholder="+7 700 000 00 00"><label>Город</label><select class="selectbox"><option>Алматы</option><option>Астана</option><option>Шымкент</option><option>Другой город</option></select><label>Способ получения</label><select class="selectbox"><option>Курьерская доставка</option><option>Самовывоз (демо)</option></select><button class="redbtn">Продолжить (демо)</button></form>`);if(key==='account')modal(`<h2>Личный кабинет</h2><p>Демонстрация авторизации будущего магазина.</p><form data-form="account"><label>Телефон или email</label><input class="inputbox" type="text" required placeholder="+7 700 000 00 00"><label>Пароль</label><input class="inputbox" type="password" required placeholder="••••••••"><button class="redbtn">Войти в демо-режиме</button></form>`);if(key==='open-search')modal(`<h2>Быстрый поиск</h2><p>Найдите детали по названию, модели автомобиля или артикулу.</p><form data-form="search"><label>Поисковый запрос</label><input name="query" class="inputbox" autofocus placeholder="Например, Camry или 04465"><button class="redbtn">${ico('search',16)} Найти товары</button></form>`);if(key==='mobilemenu')modal(`<h2>Меню AUTOSAIMAN</h2>${[['home','Главная'],['catalog','Каталог'],['favorites','Избранное'],['cart','Корзина'],['delivery','Доставка и оплата'],['about','О компании'],['contacts','Контакты']].map(x=>`<button class="outlinebtn" data-go="${x[0]}" style="display:flex;width:100%;justify-content:space-between;margin-top:8px">${x[1]} ${ico('arrow',16)}</button>`).join('')}`);if(key==='tour')modal(`<h2>Что можно протестировать?</h2><p>Это не статичная картинка. Три концепции имеют одинаковые пользовательские сценарии и разный визуальный стиль.</p><div class="specrow"><span>1</span><strong>Каталог, категории и марки</strong></div><div class="specrow"><span>2</span><strong>Поиск по названию и артикулу</strong></div><div class="specrow"><span>3</span><strong>Карточка товара</strong></div><div class="specrow"><span>4</span><strong>Корзина и избранное</strong></div><div class="specrow"><span>5</span><strong>Демо-оформление заказа</strong></div><div class="specrow"><span>6</span><strong>Переключение трёх концепций</strong></div><p>Цены, остатки, информация о товарах и действия оплаты — примеры для UX-тестирования, не реальный магазин.</p><button class="redbtn" data-action="closemodal">Понятно</button>`);if(key==='closemodal')closeModal();if(key==='clear'){state.category='all';state.brand='all';state.search='';state.sort='popular';render()}}
function carModal(){modal(`<h2>Выберите автомобиль</h2><p>В готовом магазине здесь будет подбор запчастей по марке, модели, году и VIN.</p><form data-form="car"><label>Марка автомобиля</label><select class="selectbox" required name="brand"><option value="">Выбрать марку</option>${brands.map(b=>`<option value="${b[0]}">${b[0]}</option>`).join('')}</select><label>Модель</label><input class="inputbox" required name="model" placeholder="Например, Camry, Sportage"><label>Год выпуска</label><select class="selectbox" name="year">${Array.from({length:21},(_,i)=>`<option>${2026-i}</option>`).join('')}</select><button class="redbtn">Сохранить автомобиль</button></form>`)}
function update(){persist('cart',state.cart);persist('wishlist',state.wishlist);render()}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action],[data-go],[data-category],[data-brand],[data-add],[data-wish],[data-product],[data-mode],[data-qty],[data-change-cart],[data-remove]');if(!btn)return;if(btn.dataset.action){e.preventDefault();action(btn.dataset.action);return}if(btn.dataset.go){e.preventDefault();closeModal();go(btn.dataset.go);return}if(btn.dataset.category){state.category=btn.dataset.category;state.search='';state.brand='all';go('catalog');return}if(btn.dataset.brand){state.brand=btn.dataset.brand;state.category='all';state.search='';go('catalog');return}if(btn.dataset.product){state.qty=1;go('product/'+btn.dataset.product);return}if(btn.dataset.wish){let id=Number(btn.dataset.wish);state.wishlist=state.wishlist.includes(id)?state.wishlist.filter(x=>x!==id):[...state.wishlist,id];persist('wishlist',state.wishlist);render();toast(state.wishlist.includes(id)?'Товар добавлен в избранное':'Товар удалён из избранного');return}if(btn.dataset.add){let id=Number(btn.dataset.add);state.cart[id]=(state.cart[id]||0)+(btn.dataset.detail?state.qty:1);persist('cart',state.cart);render();toast('Товар добавлен в корзину');return}if(btn.dataset.mode){state.searchMode=btn.dataset.mode;render();return}if(btn.dataset.qty){state.qty=Math.max(1,state.qty+(btn.dataset.qty==='plus'?1:-1));let q=$('#qty-number');if(q)q.textContent=state.qty;return}if(btn.dataset.changeCart){let [id,offset]=btn.dataset.changeCart.split(':').map(Number);state.cart[id]=Math.max(0,(state.cart[id]||0)+offset);if(!state.cart[id])delete state.cart[id];update();return}if(btn.dataset.remove){delete state.cart[btn.dataset.remove];update();toast('Товар удалён из корзины');return}});
document.addEventListener('change',e=>{if(e.target.id==='filterCategory'){state.category=e.target.value;render()}if(e.target.id==='filterBrand'){state.brand=e.target.value;render()}if(e.target.id==='sortSelect'){state.sort=e.target.value;render()}});
document.addEventListener('submit',e=>{let f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();let type=f.dataset.form;if(type==='search'){let val=f.querySelector('[name=query]').value.trim();if(state.searchMode==='vin'&&val.length>=12){closeModal();carModal();toast('Для подбора по VIN необходима интеграция с каталогом поставщика');return}state.search=val;state.category='all';state.brand='all';closeModal();go('catalog')}else if(type==='car'){state.cars.push({brand:f.brand.value,model:f.model.value,year:f.year.value});persist('cars',state.cars);closeModal();state.brand=f.brand.value;state.category='all';go('catalog');toast('Автомобиль сохранён для демонстрации')}else{closeModal();toast(type==='checkout'?'Демо-заказ оформлен! Оплата не списывалась.':type==='account'?'Это демонстрация: авторизация пока не подключена.':'Спасибо! Это демонстрация формы, сообщение не отправлялось.')}});
document.addEventListener('keydown',e=>{if(e.key==='Tab'&&$('.modal-backdrop')){const focusables=Array.from($('.modal').querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),a[href]')).filter(el=>el.offsetParent!==null);if(focusables.length){let first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.matches('[data-product]'))go('product/'+e.target.dataset.product)});
window.addEventListener('hashchange',()=>{state.qty=1;render()});render();
})();
</script></body></html>
